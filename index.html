<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="case">
            <div class="case-bg"></div>
            <div class="Text">
                <div class="Text0">
                    <h1 style="color: rgba(9, 61, 65);">Get Italy Quote</h1>
                    <p style="color: rgba(139, 139, 139);">All-Inclusive Italy Package</p>
                </div>
                <div class="Text1">
                    <p style="color: rgba(139, 139, 139);">Lead Passenger Name:</p>
                    <input type="Name" placeholder="Mohammad Ali">
                </div>
                <div class="Text1">
                    <p style="color: rgba(139, 139, 139);">Enter Active Number:</p>
                    <input type="Number" placeholder="+44 203 123 4567">
                </div>
                <div class="Text1">
                    <p style="color: rgba(139, 139, 139);">Enter Email:</p>
                    <input type="Email" placeholder="myemail@gmail.com">
                </div>
                <div class="Text1">
                    <p style="color: rgba(139, 139, 139);">Total Passengers:</p>
                    <input type="Passenger" placeholder="i.e 2 adults & 2 kid">
                    <div class="check">
                        <p style="color: rgba(139, 139, 139);">I accept the <span>Privacy Policy</span></p> <input class="checkbox" type="checkbox" name="" id="">
                    </div>
                </div>
                <button style="color: white; font-size: 20px;">Submit</button>
            </div>
        </div>
    </div>
</body>
</html>
